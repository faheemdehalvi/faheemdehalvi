<svg xmlns="http://www.w3.org/2000/svg" width="720" height="90" viewBox="0 0 720 90">
  <style>
    .t{font-family:-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;font-weight:800;font-size:56px;letter-spacing:-0.03em;fill:#1F2328;animation:in 900ms cubic-bezier(.16,1,.3,1) both}
    @media (prefers-color-scheme: dark){.t{fill:#E6EDF3}}
    @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  </style>
  <text class="t" x="360" y="64" text-anchor="middle">Hey, I'm Faheem</text>
</svg>
